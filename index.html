<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Book Series</title>
<meta name="description" content="The official home of the book series." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

<header class="site-head">
  <div class="wrap">
    <a class="brand" href="index.html" data-series-name>Book Series</a>
    <nav class="nav">
      <a href="#books">Books</a>
      <a href="#author">Author</a>
      <a href="#newsletter" data-newsletter-nav>Newsletter</a>
    </nav>
  </div>
</header>

<main>
  <!-- HERO: featured (first) book -->
  <section class="hero">
    <div class="wrap">
      <div class="hero-grid">
        <div>
          <p class="eyebrow" data-series-name>Book Series</p>
          <h1 data-featured-title>Loading…</h1>
          <p class="lead" data-series-tagline></p>
          <p data-featured-blurb></p>
          <div class="hero-actions" data-featured-actions></div>
        </div>
        <div class="hero-cover" data-featured-cover></div>
      </div>
    </div>
  </section>

  <!-- SERIES INTRO -->
  <section class="panel" id="about-series">
    <div class="wrap narrow center">
      <div class="rule"><span>&#10086;</span></div>
      <h2 data-series-name style="margin-top:1.5rem">The Series</h2>
      <p class="lead" data-series-description></p>
    </div>
  </section>

  <!-- ALL BOOKS -->
  <section id="books">
    <div class="wrap">
      <div class="center">
        <p class="eyebrow">The Collection</p>
        <h2>Books in the Series</h2>
      </div>
      <div class="book-list" data-book-list></div>
    </div>
  </section>

  <!-- AUTHOR -->
  <section class="panel" id="author">
    <div class="wrap narrow">
      <div class="author-grid">
        <div data-author-photo></div>
        <div>
          <p class="eyebrow">About the Author</p>
          <h2 data-author-name>The Author</h2>
          <p data-author-bio></p>
        </div>
      </div>
    </div>
  </section>

  <!-- NEWSLETTER -->
  <section id="newsletter" class="newsletter" data-newsletter hidden>
    <div class="wrap narrow">
      <div class="rule"><span>&#10086;</span></div>
      <h2 style="margin-top:1.4rem">Stay in the Story</h2>
      <p class="lead" data-newsletter-blurb></p>
      <form data-newsletter-form>
        <input type="email" name="email" placeholder="your@email.com" aria-label="Email address" required />
        <button class="btn solid" type="submit">Subscribe</button>
      </form>
    </div>
  </section>
</main>

<footer class="site-foot">
  <div class="wrap">
    <div class="brand" data-series-name>Book Series</div>
    <div class="socials" data-socials></div>
    <div class="copyright">&copy; <span data-year></span> <span data-author-name>The Author</span>. All rights reserved.</div>
  </div>
</footer>

<script src="assets/site.js"></script>
</body>
</html>
